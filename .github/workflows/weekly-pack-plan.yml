# Stage 5: run the weekly report every Monday at 7 AM Pacific.
#
# GitHub's schedule only uses UTC, which doesn't follow daylight saving, so
# this runs at both 13:37 and 14:37 UTC. weekly_report.py continues only for
# the one that is 6:37 AM Pacific that week.
#
# Why :37 and not 7:00 sharp? GitHub is busiest at the top of each hour, and
# a run scheduled for exactly 14:00 UTC started about 5.5 hours late on
# 2026-10-19. Starting a little early, at an off-peak minute, is GitHub's
# advice for getting scheduled runs on time.
#
# This repo is public, so these run logs are public too. weekly_report.py
# never prints the plan; it only goes out by email.

name: Weekly Pack Plan

on:
  schedule:
    - cron: "37 13 * * 1"  # 6:37 AM Pacific Daylight Time
    - cron: "37 14 * * 1"  # 6:37 AM Pacific Standard Time
  workflow_dispatch:      # adds a "Run workflow" button for testing

permissions:
  contents: read          # it only needs to read the code

jobs:
  send-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # cost and safety limit: stop a stuck run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Plan the week and email it
        env:
          # Secrets are stored encrypted in GitHub and hidden in logs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PACK_PLAN_EMAIL_FROM: ${{ secrets.PACK_PLAN_EMAIL_FROM }}
          PACK_PLAN_EMAIL_PASSWORD: ${{ secrets.PACK_PLAN_EMAIL_PASSWORD }}
          PACK_PLAN_EMAIL_TO: ${{ secrets.PACK_PLAN_EMAIL_TO }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python weekly_report.py
